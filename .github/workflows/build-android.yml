name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare offline web app
        run: npm run build:web

      - name: Add Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/mimee.keystore"

      - name: Set version and signing config
        working-directory: android
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          p = 'app/build.gradle'
          s = open(p).read()
          n = os.environ['RUN_NUMBER']
          s = re.sub(r'versionCode\s+\d+', 'versionCode ' + n, s, 1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.0.' + n + '"', s, 1)
          s = re.sub(r'(buildTypes\s*\{\s*release\s*\{)',
                     r'\1\n            signingConfig signingConfigs.release', s, 1)
          sign = "\n".join([
              "    signingConfigs {",
              "        release {",
              "            storeFile file(System.getenv(\"KEYSTORE_PATH\"))",
              "            storePassword System.getenv(\"KEYSTORE_PASSWORD\")",
              "            keyAlias System.getenv(\"KEY_ALIAS\")",
              "            keyPassword System.getenv(\"KEY_PASSWORD\")",
              "        }",
              "    }",
              "    buildTypes {",
          ])
          s = s.replace('buildTypes {', sign, 1)
          open(p, 'w').write(s)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/mimee.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: epub-maker-apk
          path: android/app/build/outputs/apk/release/app-release.apk
